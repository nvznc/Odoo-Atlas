[tool.ruff]
target-version = "py312"
line-length = 100
src = ["addons"]
extend-exclude = [
    "backups",
    ".git",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "C4", "C90", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D", "F401", "I001"]
"**/__init__.py" = ["D", "F401", "I001"]
"__manifest__.py" = ["B018", "D"]
"**/__manifest__.py" = ["B018", "D"]
"**/tests/*.py" = ["D", "ANN"]
"**/tests/**/*.py" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
